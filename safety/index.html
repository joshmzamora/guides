<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quality = Customer Safety</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23fff'/%3E%3Cpath d='M32 6 52 14v15c0 13-8 24-20 29-12-5-20-16-20-29V14L32 6Z' fill='%23fff' stroke='%23101010' stroke-width='5' stroke-linejoin='round'/%3E%3Cpath d='m23 32 7 7 14-18' fill='none' stroke='%23ed1b2d' stroke-width='6' stroke-linecap='square' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --red: #ed1b2d;
      --red-dark: #c81020;
      --status-green: #16833a;
      --status-yellow: #f2c230;
      --yellow: var(--status-yellow);
      --black: #101010;
      --white: #ffffff;
      --paper: var(--white);
      --panel: var(--white);
      --ink: var(--black);
      --muted: rgba(16, 16, 16, 0.68);
      --line: rgba(16, 16, 16, 0.18);
      --navy-950: var(--black);
      --navy-900: #171717;
      --navy-800: var(--black);
      --navy-700: #2a2a2a;
      --steel-100: var(--white);
      --steel-200: rgba(255, 255, 255, 0.86);
      --steel-300: rgba(255, 255, 255, 0.7);
      --steel-500: rgba(16, 16, 16, 0.68);
      --blue: var(--red);
      --teal: var(--red);
      --green: var(--black);
      --orange: var(--red);
      --shadow: none;
      --radius: 0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: "Aptos", "Segoe UI", Tahoma, sans-serif;
      background: var(--paper);
      color: var(--black);
      display: grid;
      place-items: stretch;
      padding: 0;
      overflow: hidden;
    }

    button {
      font: inherit;
    }

    .deck {
      position: relative;
      z-index: 1;
      width: 100vw;
      height: 100svh;
      min-height: 100svh;
      background: var(--white);
      border: 0;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .topbar {
      position: relative;
      z-index: 2;
      height: 86px;
      display: grid;
      grid-template-columns: minmax(260px, 1fr) minmax(300px, 520px) auto;
      gap: 18px;
      align-items: center;
      padding: 18px 22px 14px;
      border-bottom: 1px solid var(--black);
      background: var(--white);
      color: var(--black);
    }

    .topbar.compact {
      height: 50px;
      grid-template-columns: minmax(180px, 1fr) auto;
      gap: 12px;
      padding: 7px 16px;
    }

    .topbar.compact .brand-title {
      margin-top: 0;
      font-size: 0.9rem;
    }

    .topbar.compact .progress-wrap {
      display: none;
    }

    .topbar.compact .nav-controls {
      gap: 7px;
    }

    .topbar.compact .btn {
      min-height: 34px;
      padding: 0 10px;
      font-size: 0.78rem;
    }

    .brand-kicker {
      display: none;
      color: var(--red);
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .brand-title {
      margin-top: 4px;
      font-family: "Aptos Display", "Bahnschrift", "Segoe UI", sans-serif;
      font-size: 1.08rem;
      font-weight: 800;
    }

    .progress-wrap {
      display: grid;
      gap: 7px;
    }

    .progress-label {
      color: var(--black);
      font-size: 0.82rem;
      display: flex;
      justify-content: space-between;
      gap: 16px;
    }

    .progress-track {
      height: 8px;
      border-radius: 999px;
      background: rgba(16, 16, 16, 0.16);
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      border-radius: inherit;
      background: var(--red);
      transition: width 260ms ease;
    }

    .nav-controls {
      display: flex;
      gap: 9px;
      justify-content: flex-end;
      align-items: center;
    }

    .btn {
      border: 1px solid var(--black);
      color: var(--black);
      background: var(--white);
      border-radius: var(--radius);
      min-height: 40px;
      padding: 0 14px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .btn:hover:not(:disabled),
    .btn:focus-visible {
      transform: translateY(-1px);
      color: var(--white);
      background: var(--black);
      border-color: var(--black);
      outline: none;
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.42;
    }

    .btn.primary {
      color: var(--white);
      background: var(--red);
      border-color: var(--red);
      box-shadow: none;
    }

    .btn.primary:hover:not(:disabled),
    .btn.primary:focus-visible {
      color: var(--red);
      background: var(--white);
    }

    .btn.warn {
      background: var(--white);
      border-color: var(--black);
      color: var(--black);
    }

    .btn.danger {
      background: var(--white);
      border-color: var(--red);
      color: var(--red);
    }

    .screen {
      position: relative;
      z-index: 1;
      height: 100%;
      padding: 0;
      overflow: hidden;
      animation: screen-in 240ms ease both;
    }

    .topbar.compact + .screen {
      height: calc(100% - 50px);
    }

    .game-screen {
      padding: 6px clamp(16px, 2.5vw, 38px) 8px;
    }

    .activity-fullscreen {
      height: 100%;
      padding: 0;
    }

    .briefing {
      height: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(260px, 0.75fr);
      gap: clamp(18px, 3vw, 42px);
      align-items: stretch;
      min-height: 0;
    }

    .briefing-main,
    .briefing-side {
      border: 2px solid var(--black);
      background: var(--white);
      overflow: hidden;
    }

    .briefing-main {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      align-content: stretch;
      gap: clamp(20px, 3vh, 34px);
      padding: clamp(28px, 3.5vw, 56px);
      border-left: 18px solid var(--red);
      position: relative;
    }

    .briefing-side {
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 18px;
      padding: clamp(18px, 2.4vw, 34px);
      background: rgba(16, 16, 16, 0.035);
    }

    .briefing-side .scene-visual {
      width: min(100%, 520px);
      height: min(46vh, 420px);
      min-height: 280px;
    }

    .briefing-kicker {
      width: max-content;
      padding: 6px 10px;
      color: var(--white);
      background: var(--black);
      border-left: 8px solid var(--red);
      font-size: 0.82rem;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .briefing h2 {
      max-width: none;
      margin: 0;
      font-size: clamp(3.8rem, 6vw, 7rem);
      line-height: 0.9;
    }

    .briefing-steps {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: minmax(0, 1fr);
      gap: clamp(14px, 1.8vw, 28px);
      min-height: 0;
    }

    .briefing-step {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      align-content: stretch;
      gap: clamp(18px, 3vh, 34px);
      min-height: 0;
      padding: clamp(24px, 3vw, 48px);
      border: 2px solid var(--black);
      background: var(--white);
    }

    .briefing-step strong {
      color: var(--red);
      font-size: clamp(1.15rem, 1.45vw, 1.8rem);
      font-weight: 950;
      text-transform: uppercase;
    }

    .briefing-step span {
      display: grid;
      align-items: center;
      color: var(--black);
      font-size: clamp(1.55rem, 2.15vw, 2.8rem);
      font-weight: 900;
      line-height: 1.04;
    }

    .briefing-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .game-screen .lead.tight {
      display: none;
    }

    .game-screen .eyebrow {
      display: none;
    }

    @keyframes screen-in {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .slide {
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(520px, 1.06fr) minmax(380px, 0.94fr);
      gap: clamp(28px, 4.4vw, 64px);
      align-items: center;
    }

    .slide:not(.hero-slide):not(.centered) h2 {
      font-size: clamp(4rem, 6.2vw, 7rem);
      line-height: 0.95;
      max-width: 12ch;
      margin-bottom: 14px;
      text-wrap: balance;
    }

    .slide:not(.hero-slide) .lead {
      max-width: 820px;
      font-size: clamp(1.25rem, 1.55vw, 1.75rem);
      line-height: 1.24;
    }

    .hero-slide {
      grid-template-columns: 1fr;
      align-content: center;
    }

    .hero-copy {
      max-width: min(980px, 82vw);
    }

    .hero-slide h1 {
      font-size: clamp(4.8rem, 8vw, 8.2rem);
      max-width: 12ch;
    }

    .hero-slide .subtitle {
      max-width: 760px;
      font-size: clamp(1.4rem, 2vw, 2rem);
    }

    .slide.centered {
      grid-template-columns: 1fr;
      place-items: center;
      text-align: center;
    }

    .slide.centered h2 {
      font-size: clamp(4.4rem, 7vw, 8rem);
      line-height: 0.96;
      text-wrap: balance;
    }

    .eyebrow {
      display: none;
      align-items: center;
      gap: 8px;
      color: var(--red);
      font-weight: 900;
      font-size: 0.82rem;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 24px;
      height: 2px;
      background: var(--teal);
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 16px;
      font-family: "Aptos Display", "Bahnschrift", "Segoe UI", sans-serif;
      font-size: 4.4rem;
      line-height: 0.98;
      max-width: 13ch;
      color: var(--black);
    }

    h2 {
      margin-bottom: 14px;
      font-family: "Aptos Display", "Bahnschrift", "Segoe UI", sans-serif;
      font-size: 3.15rem;
      line-height: 1.02;
      max-width: 16ch;
      color: var(--black);
    }

    h3 {
      margin-bottom: 10px;
      color: var(--ink);
      font-family: "Aptos Display", "Bahnschrift", "Segoe UI", sans-serif;
      font-size: 1.25rem;
      line-height: 1.12;
    }

    .subtitle,
    .lead {
      max-width: 760px;
      color: var(--black);
      font-size: 1.35rem;
      line-height: 1.45;
    }

    .lead.tight {
      font-size: 1.18rem;
    }

    .canvas-panel,
    .light-panel,
    .game-panel,
    .menu-card {
      border-radius: var(--radius);
      background: var(--white);
      color: var(--ink);
      box-shadow: var(--shadow);
      border: 1px solid var(--black);
    }

    .canvas-panel {
      height: 100%;
      min-height: 0;
      max-height: 100%;
      padding: clamp(18px, 2.2vw, 30px);
      display: grid;
      align-content: center;
      border-width: 2px;
      overflow: hidden;
    }

    .slide-visual {
      display: grid;
      height: 100%;
      min-height: 0;
      max-height: 100%;
      align-content: center;
      gap: 10px;
      overflow: hidden;
    }

    .visual-label {
      width: max-content;
      padding: 6px 10px;
      color: var(--white);
      background: var(--black);
      border-left: 8px solid var(--red);
      font-size: 0.78rem;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .system-map {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      align-items: stretch;
    }

    .map-center {
      grid-column: 1 / -1;
      display: grid;
      gap: 8px;
      place-items: center;
      min-height: 118px;
      color: var(--white);
      background: var(--red);
      border: 2px solid var(--black);
      font-size: clamp(1.45rem, 2.2vw, 2.55rem);
      font-weight: 950;
      line-height: 1;
      text-align: center;
    }

    .map-center .diagram-icon {
      width: clamp(64px, 5vw, 92px);
      height: clamp(64px, 5vw, 92px);
      background: var(--white);
      border: 2px solid var(--black);
    }

    .map-node {
      min-height: 104px;
      display: grid;
      grid-template-rows: auto auto;
      align-content: center;
      justify-items: center;
      gap: 6px;
      padding: 10px;
      border: 2px solid var(--black);
      background: var(--white);
      text-align: center;
    }

    .map-node strong {
      color: var(--black);
      font-size: clamp(1rem, 1.25vw, 1.42rem);
      line-height: 1;
      text-wrap: balance;
    }

    .diagram-icon {
      display: grid;
      place-items: center;
      width: clamp(54px, 4.5vw, 78px);
      height: clamp(54px, 4.5vw, 78px);
      color: var(--black);
    }

    .diagram-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .outcome-flow {
      display: grid;
      gap: 8px;
    }

    .flow-row {
      display: grid;
      grid-template-columns: 78px minmax(0, 1fr);
      align-items: center;
      min-height: 88px;
      border: 2px solid var(--black);
      background: var(--white);
    }

    .flow-row .node {
      display: grid;
      place-items: center;
      height: 100%;
      color: var(--white);
      background: var(--red);
      font-size: 1.7rem;
      font-weight: 950;
    }

    .flow-row .node .diagram-icon {
      width: clamp(48px, 3.8vw, 66px);
      height: clamp(48px, 3.8vw, 66px);
      background: var(--white);
      border: 2px solid var(--black);
    }

    .flow-row span:last-child {
      padding: 0 14px;
      color: var(--black);
      font-size: clamp(1.18rem, 1.75vw, 2.05rem);
      font-weight: 950;
      line-height: 1.05;
      text-wrap: balance;
    }

    .rhythm-diagram {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .rhythm-step {
      min-height: 220px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      border: 2px solid var(--black);
      background: var(--white);
    }

    .rhythm-step strong {
      padding: 8px;
      color: var(--white);
      background: var(--black);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .rhythm-step span {
      display: grid;
      place-items: center;
      padding: 8px 10px 14px;
      color: var(--black);
      font-size: clamp(1.05rem, 1.45vw, 1.7rem);
      font-weight: 950;
      line-height: 1;
      text-align: center;
    }

    .rhythm-step .diagram-icon {
      justify-self: center;
      align-self: end;
      margin-top: 12px;
    }

    .pillar-stack {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }

    .pillar {
      min-height: 98px;
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 6px;
      padding: 10px;
      border: 2px solid var(--black);
      background: var(--white);
      color: var(--black);
      font-size: clamp(0.95rem, 1.1vw, 1.25rem);
      font-weight: 950;
      line-height: 1.08;
      text-align: center;
    }

    .pillar.primary {
      grid-column: 1 / -1;
      min-height: 126px;
      color: var(--white);
      background: var(--red);
      font-size: clamp(1.5rem, 2vw, 2.35rem);
      text-align: center;
    }

    .pillar.primary .diagram-icon {
      background: var(--white);
      border: 2px solid var(--black);
    }

    .systems-board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
    }

    .system-tile {
      min-height: 102px;
      display: grid;
      grid-template-rows: auto auto;
      place-items: center;
      gap: 5px;
      padding: 9px 8px;
      border: 2px solid var(--black);
      color: var(--black);
      background: var(--white);
      font-size: clamp(0.82rem, 0.92vw, 1.02rem);
      font-weight: 950;
      line-height: 1.08;
      text-align: center;
    }

    .system-tile .diagram-icon {
      width: clamp(42px, 3.5vw, 56px);
      height: clamp(42px, 3.5vw, 56px);
    }

    .signal {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      background: var(--white);
    }

    .signal strong {
      display: block;
      color: var(--black);
      font-size: 1rem;
      margin-bottom: 8px;
    }

    .signal span {
      color: var(--muted);
      line-height: 1.35;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .menu-layout {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 18px;
      height: 100%;
      min-height: 0;
    }

    .menu-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: end;
    }

    .menu-header h2 {
      margin-bottom: 6px;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: minmax(420px, 780px);
      grid-template-rows: minmax(0, 1fr);
      gap: 16px;
      justify-content: center;
      min-height: 0;
    }

    .menu-card {
      padding: 18px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 0;
      transition: transform 170ms ease, box-shadow 170ms ease;
      position: relative;
      overflow: hidden;
    }

    .menu-card:hover {
      transform: translateY(-4px);
      box-shadow: inset 0 -6px 0 var(--red);
    }

    .menu-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 7px;
      background: var(--red);
    }

    .activity-index {
      display: inline-grid;
      place-items: center;
      min-width: 54px;
      height: 42px;
      padding: 0 10px;
      color: var(--white);
      background: var(--black);
      font-weight: 950;
      font-size: 1.22rem;
    }

    .menu-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .menu-icon {
      width: 46px;
      height: 46px;
      color: var(--black);
    }

    .menu-card .time {
      color: var(--blue);
      font-weight: 900;
      font-size: 0.98rem;
      text-transform: uppercase;
    }

    .menu-card p {
      color: var(--muted);
      line-height: 1.22;
      font-size: clamp(1.25rem, 1.45vw, 1.7rem);
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .menu-card h3 {
      font-size: clamp(2.4rem, 3.5vw, 4.2rem);
      line-height: 1.08;
      margin-bottom: 8px;
      text-wrap: balance;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .menu-card .btn {
      min-height: 58px;
      padding: 0 18px;
      font-size: 1.2rem;
    }

    .menu-card-body {
      min-height: 0;
      overflow: hidden;
    }

    .game-shell {
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      gap: 0;
      height: 100%;
      min-height: 0;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(340px, 0.9fr) minmax(500px, 1.1fr);
      gap: 16px;
      height: 100%;
      min-height: 0;
    }

    .workspace.host {
      grid-template-columns: 1fr;
      align-items: stretch;
      min-height: 0;
    }

    .audience-stage {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(190px, 0.82fr);
      grid-template-rows: minmax(0, 2fr) minmax(130px, 1fr) minmax(30px, auto);
      gap: 8px;
      height: 100%;
      min-height: 0;
    }

    .decision-stage {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: minmax(96px, 0.8fr) minmax(124px, 0.78fr) minmax(160px, 1.36fr) auto;
      gap: 10px;
      height: 100%;
      min-height: 0;
    }

    .decision-movie-stage {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      gap: 10px;
      height: 100%;
      min-height: 0;
    }

    .decision-movie-card {
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      gap: 0;
      padding: 0;
      border: 0;
      background: #101010;
      animation: decision-panel-in 240ms ease both;
    }

    .decision-alert-stage {
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      gap: 10px;
      height: 100%;
      min-height: 0;
    }

    /* Alert treatment: a compact operations console layered over the scene. */
    .alert-ui-panel {
      position: relative;
      z-index: 2;
      display: grid;
      gap: 14px;
      align-content: center;
      min-width: 0;
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, 0.52);
      background: rgba(16, 16, 16, 0.76);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.34), inset 0 0 0 6px rgba(255, 255, 255, 0.035);
      backdrop-filter: blur(8px);
    }

    .alert-ui-header,
    .alert-ui-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .alert-ui-header {
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.72);
      font-size: 0.68rem;
      font-weight: 950;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .alert-ui-live {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #fff;
    }

    .alert-ui-live::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 0 4px rgba(237, 27, 45, 0.22);
      animation: alert-flash 900ms steps(2, end) infinite;
    }

    .alert-ui-panel .alert-timer {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 12px;
      aspect-ratio: auto;
      padding: 14px 0 16px;
      border: 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      background: transparent;
      box-shadow: none;
      animation: none;
    }

    .alert-ui-panel .alert-timer::before {
      content: "DECISION WINDOW";
      align-self: center;
      color: rgba(255, 255, 255, 0.62);
      font-size: 0.68rem;
      font-weight: 950;
      letter-spacing: 0.13em;
    }

    .alert-ui-panel .alert-timer span { display: none; }
    .alert-ui-panel .alert-timer strong {
      font-size: clamp(2rem, 3vw, 3.9rem);
      letter-spacing: 0.02em;
      line-height: 0.9;
    }

    .alert-ui-row {
      padding: 9px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.64);
      font-size: 0.68rem;
      font-weight: 950;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .alert-ui-row strong { color: #fff; font-size: 0.72rem; }
    .alert-ui-row strong.warn { color: var(--yellow); }
    .alert-ui-row strong.blocked { color: var(--red); }

    .alert-ui-track {
      position: relative;
      height: 5px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.16);
    }

    .alert-ui-track::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 64%;
      background: var(--red);
      animation: alert-track 2400ms ease-in-out infinite alternate;
    }

    @keyframes alert-track { from { width: 64%; } to { width: 48%; } }

    .alert-cinema::after { display: none; }

    .alert-clock-simple {
      position: relative;
      z-index: 2;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 14px;
      min-height: 280px;
      padding: clamp(24px, 4vw, 54px);
      border: 2px solid rgba(255, 255, 255, 0.8);
      background: rgba(16, 16, 16, 0.72);
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.38), inset 0 0 0 8px rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(8px);
      animation: clock-enter 620ms 180ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    .alert-clock-simple span {
      color: rgba(255, 255, 255, 0.68);
      font-size: clamp(0.82rem, 1vw, 1.1rem);
      font-weight: 950;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .alert-clock-simple strong {
      color: var(--white);
      font-size: clamp(2.6rem, 4vw, 5rem);
      font-weight: 950;
      line-height: 0.9;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 30px rgba(237, 27, 45, 0.5);
      animation: clock-pulse 1000ms ease-in-out infinite;
    }

    .alert-copy h2 { animation: alert-copy-in 600ms ease both; }
    .alert-lines p { animation: alert-copy-in 680ms cubic-bezier(.2,.8,.2,1) both; }
    .alert-lines p:nth-child(2) { animation-delay: 180ms; }
    .alert-lines p:nth-child(3) { animation-delay: 360ms; }

    @keyframes clock-enter {
      from { opacity: 0; transform: translateX(24px) scale(0.96); }
      to { opacity: 1; transform: translateX(0) scale(1); }
    }

    @keyframes clock-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.82; }
    }

    @keyframes alert-copy-in {
      from { opacity: 0; transform: translateX(-34px) scale(.97); }
      to { opacity: 1; transform: translateX(0); }
    }

      font-size: 1.28rem;
      font-weight: 850;
      line-height: 1.25;
      margin-bottom: 16px;
    }

    .choice-grid {
      display: grid;
      gap: 7px;
    }

    .choice-btn {
      width: 100%;
      text-align: left;
      color: var(--ink);
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 13px 14px;
      font-weight: 850;
      cursor: pointer;
      transition: transform 150ms ease, border-color 150ms ease, box-shadow 150ms ease, background 150ms ease;
    }

    .choice-btn.host-choice {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 9px;
      align-items: center;
      min-height: 50px;
      padding: 7px 10px 7px 7px;
      font-size: clamp(0.86rem, 0.92vw, 1rem);
      line-height: 1.16;
    }

    .choice-index {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      color: var(--white);
      background: var(--black);
      font-weight: 950;
      font-size: 0.86rem;
    }

    .choice-btn:hover:not(:disabled),
    .choice-btn:focus-visible {
      transform: translateY(-1px);
      border-color: var(--red);
      box-shadow: none;
      outline: none;
    }

    .choice-btn.selected {
      border-color: var(--red);
      background: rgba(237, 27, 45, 0.08);
      box-shadow: inset 6px 0 0 var(--red);
    }

    .choice-btn.selected .choice-index {
      background: var(--red);
    }

    .decision-choice,
    .decision-choice.selected,
    .decision-choice.tone-red,
    .decision-choice.tone-yellow,
    .decision-choice.tone-green {
      color: var(--black);
      border-color: var(--black);
      background: var(--white);
      box-shadow: none;
    }

    .decision-choice.selected { box-shadow: inset 6px 0 0 var(--black); }
    .decision-choice .choice-index,
    .decision-choice.selected .choice-index { background: var(--black); color: var(--white); }

    .choice-btn.tone-green {
      border-color: rgba(22, 131, 58, 0.52);
    }

    .choice-btn.tone-green .choice-index {
      background: var(--status-green);
    }

    .choice-btn.tone-green.selected {
      background: rgba(22, 131, 58, 0.1);
      border-color: var(--status-green);
      box-shadow: inset 6px 0 0 var(--status-green);
    }

    .choice-btn.tone-yellow {
      border-color: rgba(180, 132, 0, 0.5);
    }

    .choice-btn.tone-yellow .choice-index {
      color: var(--black);
      background: var(--status-yellow);
    }

    .choice-btn.tone-yellow.selected {
      background: rgba(242, 194, 48, 0.18);
      border-color: #b48400;
      box-shadow: inset 6px 0 0 var(--status-yellow);
    }

    .choice-btn.tone-red {
      border-color: rgba(237, 27, 45, 0.54);
    }

    .choice-btn.tone-red .choice-index {
      background: var(--red);
    }

    .choice-btn.tone-red.selected {
      background: rgba(237, 27, 45, 0.1);
      border-color: var(--red);
      box-shadow: inset 6px 0 0 var(--red);
    }

    .choice-btn:disabled {
      cursor: default;
    }

    .host-round {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 0;
      color: var(--red);
      background: transparent;
      font-size: 0.72rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .host-instruction {
      margin: 0;
      padding: 8px 10px;
      border-left: 6px solid var(--red);
      background: rgba(237, 27, 45, 0.06);
      color: var(--black);
      font-weight: 800;
      line-height: 1.35;
      font-size: 0.92rem;
    }

    .host-situation .host-instruction {
      display: none;
    }

    .host-answer {
      display: grid;
      gap: 6px;
      margin-top: 0;
      border: 2px solid var(--black);
      border-left: 10px solid var(--red);
      padding: clamp(10px, 1.15vw, 16px);
      background: var(--white);
      animation: reveal 180ms ease both;
      max-height: 100%;
      overflow: hidden;
    }

    .host-answer strong {
      color: var(--black);
      font-size: clamp(1rem, 1.25vw, 1.42rem);
      line-height: 1.06;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .host-answer p {
      margin-bottom: 0;
      color: var(--black);
      font-size: clamp(0.84rem, 0.95vw, 1.02rem);
      font-weight: 800;
      line-height: 1.24;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .host-meter {
      display: grid;
      gap: 7px;
      margin-top: 8px;
    }

    .host-meter-labels {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .host-meter-track {
      position: relative;
      height: 28px;
      background: rgba(16, 16, 16, 0.14);
      border: 1px solid var(--black);
    }

    .host-meter-fill {
      height: 100%;
      width: 50%;
      background: var(--red);
      transition: width 360ms ease;
    }

    .score-large {
      margin: 4px 0 0;
      color: var(--black);
      font-size: clamp(3rem, 5.2vw, 5.3rem);
      font-weight: 950;
      line-height: 0.9;
    }

    .score-large::after {
      content: " confidence";
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .context-stack {
      display: grid;
      gap: 6px;
      margin-top: 8px;
      min-height: 0;
    }

    .context-item {
      padding: 8px 10px;
      border: 1px solid var(--line);
      background: var(--white);
      color: var(--black);
      font-size: 0.88rem;
      font-weight: 850;
      line-height: 1.18;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .host-situation .context-stack {
      max-height: 46%;
      overflow: hidden;
    }

    .context-item::before {
      content: "FACT";
      display: inline-block;
      margin-right: 10px;
      color: var(--red);
      font-size: 0.72rem;
      font-weight: 950;
      text-transform: uppercase;
    }

    .context-item.revealed {
      border-color: var(--red);
      box-shadow: inset 6px 0 0 var(--red);
    }

    .feedback {
      margin-top: 4px;
      border-radius: var(--radius);
      padding: 9px 10px;
      background: rgba(237, 27, 45, 0.06);
      border: 1px solid rgba(237, 27, 45, 0.2);
      color: var(--muted);
      font-size: 0.84rem;
      line-height: 1.25;
      animation: reveal 180ms ease both;
    }

    .takeaway {
      margin-top: 4px;
      border-radius: var(--radius);
      padding: 10px 12px;
      background: var(--black);
      border: 1px solid var(--black);
      color: var(--white);
      font-weight: 900;
      line-height: 1.24;
      overflow: hidden;
    }

    .audience-visual .takeaway,
    .host-vote .takeaway {
      padding: clamp(9px, 1vw, 14px);
      font-size: clamp(0.86rem, 1vw, 1.08rem);
      line-height: 1.18;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .result-title {
      color: var(--navy-800);
      font-size: 1.55rem;
      font-weight: 950;
      margin-bottom: 8px;
    }

    .big-message {
      max-width: 980px;
      color: var(--black);
      font-family: "Aptos Display", "Bahnschrift", "Segoe UI", sans-serif;
      font-size: clamp(4.8rem, 7.5vw, 8.4rem);
      line-height: 0.96;
      font-weight: 950;
      text-wrap: balance;
    }

    ul.clean-list {
      margin: 18px 0 0;
      padding-left: 1.2em;
      color: var(--black);
      font-size: 1.25rem;
      line-height: 1.5;
    }

    .muted {
      color: var(--steel-300);
    }

    .dark-muted {
      color: var(--muted);
    }

    @media (max-width: 1200px) {
      body {
        overflow: auto;
        place-items: start center;
      }

      .deck {
        width: 100vw;
        height: auto;
        min-height: 100svh;
      }

      .topbar {
        grid-template-columns: 1fr;
        height: auto;
      }

      .nav-controls {
        justify-content: start;
      }

      .screen {
        height: auto;
        min-height: calc(100svh - 86px);
      }

      .slide,
      .workspace,
      .briefing,
      .menu-header {
        grid-template-columns: 1fr;
      }

      .simple-slide-icon {
        justify-self: center;
        transform: none;
        margin: 0;
      }

      .briefing-steps {
        grid-template-columns: 1fr;
      }

      .decision-scenario-body {
        grid-template-columns: 1fr;
      }

      .lab-uncertainty-diagram {
        height: 460px;
        min-height: 380px;
      }

      .menu-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px) {
      body {
        padding: 0;
      }

      .deck {
        width: 100vw;
        min-height: 100svh;
        border-radius: 0;
      }

      .topbar {
        padding: 14px;
      }

      .screen {
        padding: 16px;
      }

      h1 {
        font-size: 2.8rem;
      }

      h2 {
        font-size: 2.15rem;
      }

      .subtitle,
      .lead {
        font-size: 1.08rem;
      }

      .menu-grid {
        grid-template-columns: 1fr;
      }

      .big-message {
        font-size: 2.55rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>

      function create(tag, options = {}, children = []) {
        const node = document.createElement(tag);
        if (options.className) node.className = options.className;
        if (options.text !== undefined) node.textContent = options.text;
        if (options.ariaLabel) node.setAttribute("aria-label", options.ariaLabel);
        if (options.type) node.setAttribute("type", options.type);
        if (options.disabled) node.disabled = true;
        if (options.value !== undefined) node.value = options.value;
        if (options.title) node.title = options.title;
        if (options.role) node.setAttribute("role", options.role);
        if (options.src) node.setAttribute("src", options.src);
        if (options.alt !== undefined) node.setAttribute("alt", options.alt);
        if (options.loading) node.setAttribute("loading", options.loading);
        if (options.decoding) node.setAttribute("decoding", options.decoding);
        if (options.style) {
          Object.entries(options.style).forEach(([key, value]) => {
            node.style[key] = value;
          });
        }
        if (options.dataset) {
          Object.entries(options.dataset).forEach(([key, value]) => {
            node.dataset[key] = value;
          });
        }
        if (options.onClick) node.addEventListener("click", options.onClick);
        children.forEach((child) => {
          if (child === null || child === undefined) return;
          if (typeof child === "string") {
            node.appendChild(document.createTextNode(child));
          } else {
            node.appendChild(child);
          }
        });
        return node;
      }

      function svgEl(tag, attrs = {}, children = []) {
        const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
        Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
        children.forEach((child) => {
          if (typeof child === "string") {
            node.appendChild(document.createTextNode(child));
          } else {
            node.appendChild(child);
          }
        });
        return node;
      }

      function choiceToneClass(label, score = null) {
        if (typeof score === "number") {
          if (score >= 85) return "tone-green";
          if (score >= 50) return "tone-yellow";
          return "tone-red";
        }
        const text = label.toLowerCase();
        if (text.includes("green") || text === "ship" || text.includes("release with confidence") || text.includes("in spec and controlled") || text.includes("risk controlled")) {
          return "tone-green";
        }
        if (text.includes("yellow") || text === "hold" || text.includes("hold / review") || text.includes("hold and investigate") || text.includes("segregate") || text.includes("repeat and expand") || text.includes("reinspect") || text.includes("need more info") || text.includes("in spec but uncertain") || text.includes("out of spec and contained") || text.includes("call customer")) {
          return "tone-yellow";
        }
        if (text.includes("red") || text.includes("escalate") || text.includes("contain") || text.includes("customer risk") || text.includes("risk transferred") || text.includes("ship now") || text.includes("ship as planned") || text.includes("release because") || text.includes("release current") || text.includes("increase future") || text.includes("blend") || text.includes("discount") || text.includes("notify after") || text.includes("ignore")) {
          return "tone-red";
        }
        return "";
      }

      function renderAlertCountdown(value) {
        const parts = value.split(":").map((part) => Number(part) || 0);
        let remaining = (parts[0] * 3600) + (parts[1] * 60) + parts[2];
        const format = (seconds) => {
          const hours = Math.floor(seconds / 3600);
          const minutes = Math.floor((seconds % 3600) / 60);
          const secs = seconds % 60;
          const clockParts = hours > 0 ? [hours, minutes, secs] : [minutes, secs];
          return clockParts.map((part) => String(part).padStart(2, "0")).join(":");
        };
        const readout = create("strong", { text: format(remaining) });
        activeCountdown = setInterval(() => {
          remaining = Math.max(0, remaining - 1);
          readout.textContent = format(remaining);
          if (remaining === 0 && activeCountdown) {
            clearInterval(activeCountdown);
            activeCountdown = null;
          }
        }, 1000);
        return create("div", { className: "alert-clock-simple" }, [
          create("span", { text: "Decision clock" }),
          readout
        ]);
      }

      function chooseDecision(choiceIndex) {
        const gameState = state.decision;
        if (!gameState) return;
        const scenario = DATA.decisionScenarios[gameState.scenarioIndex];
        const choice = scenario.choices[choiceIndex];
        gameState.selectedChoice = choiceIndex;
        gameState.answers = gameState.answers || [];
        gameState.answers[gameState.scenarioIndex] = choiceIndex;
        gameState.score = gameState.answers.reduce((total, answerIndex, scenarioIndex) => {
          const answeredScenario = DATA.decisionScenarios[scenarioIndex];
          const answeredChoice = answeredScenario && answeredScenario.choices[answerIndex];
          return total + (answeredChoice ? answeredChoice.score || 0 : 0);
        }, 0);
        gameState.feedback = choice.feedback;
        gameState.phase = choice.jumpToWorst ? "worst" : "reveal";
        gameState.scenarioCollapsed = true;
        render();
      }

      function previousDecisionScenario() {
        const gameState = state.decision;
        if (!gameState || gameState.scenarioIndex === 0) return;
        gameState.scenarioIndex -= 1;
        gameState.selectedChoice = gameState.answers ? gameState.answers[gameState.scenarioIndex] ?? null : null;
        gameState.feedback = "";
        gameState.scenarioCollapsed = false;
        gameState.phase = "movie";
        gameState.trailerIndex = 0;
        gameState.finished = false;
        render();
      }

      function nextDecisionScenario() {
        const gameState = state.decision;
        if (gameState.scenarioIndex >= DATA.decisionScenarios.length - 1) {
          gameState.finished = true;
        } else {
          gameState.scenarioIndex += 1;
          gameState.selectedChoice = gameState.answers ? gameState.answers[gameState.scenarioIndex] ?? null : null;
          gameState.feedback = "";
          gameState.scenarioCollapsed = false;
          gameState.phase = "movie";
          gameState.trailerIndex = 0;
        }
        render();
      }

      function applyInitialHash() {
        const rawHash = window.location.hash.replace(/^#/, "");
        if (!rawHash) return;
        const params = new URLSearchParams(rawHash);
        if (params.get("screen") !== "game") return;
        state.activeGame = "decision";
        state.screen = "game";
        resetGame("decision");
        const gameState = state.decision;
        const maxScenario = DATA.decisionScenarios.length - 1;
        const scenarioIndex = clamp(Number(params.get("scenario") || 0), 0, maxScenario);
        const requestedPhase = params.get("phase") || "movie";
        const phase = requestedPhase === "alert" ? "intro" : requestedPhase;
        const choiceIndex = params.has("choice") ? clamp(Number(params.get("choice")), 0, 3) : null;
        gameState.scenarioIndex = scenarioIndex;
        gameState.phase = phase;
        gameState.scenarioCollapsed = phase === "vote" || phase === "reveal" || phase === "worst";
        if (choiceIndex !== null) {
          gameState.selectedChoice = choiceIndex;
          gameState.answers[scenarioIndex] = choiceIndex;
          gameState.score = DATA.decisionScenarios[scenarioIndex].choices[choiceIndex].score || 0;
        }
      }

      function advanceDecisionGame() {
        const gameState = state.decision;
        const scenario = DATA.decisionScenarios[gameState.scenarioIndex];
        if (gameState.finished || !scenario) {
          return;
        }
        if (gameState.phase === "movie") {
          const lastShot = Math.max(0, (scenario.trailer || []).length - 1);
          if (gameState.trailerIndex < lastShot) gameState.trailerIndex += 1;
          else gameState.phase = "intro";
        } else if (gameState.phase === "alert") {
          gameState.phase = "intro";
        } else if (gameState.phase === "intro") {
          gameState.phase = "vote";
        } else if (gameState.phase === "vote") {
          return;
        } else if (gameState.phase === "reveal") {
          gameState.phase = "worst";
        } else if (gameState.phase === "worst") {
          nextDecisionScenario();
          return;
        }
        render();
      }

      function reverseDecisionGame() {
        const gameState = state.decision;
        if (gameState.finished) {
          gameState.finished = false;
          gameState.scenarioIndex = DATA.decisionScenarios.length - 1;
          gameState.selectedChoice = gameState.answers[gameState.scenarioIndex] ?? null;
          gameState.phase = gameState.selectedChoice === null ? "vote" : "worst";
          render();
          return;
        }
        if (gameState.phase === "movie") {
          if (gameState.trailerIndex > 0) {
            gameState.trailerIndex -= 1;
          } else if (gameState.scenarioIndex > 0) {
            gameState.scenarioIndex -= 1;
            gameState.selectedChoice = gameState.answers[gameState.scenarioIndex] ?? null;
            gameState.phase = gameState.selectedChoice === null ? "vote" : "worst";
          } else {
            state.screen = "briefing";
          }
        } else if (gameState.phase === "alert") {
          gameState.phase = "movie";
          gameState.trailerIndex = Math.max(0, (DATA.decisionScenarios[gameState.scenarioIndex].trailer || []).length - 1);
        } else if (gameState.phase === "intro") {
          gameState.phase = "movie";
          gameState.trailerIndex = Math.max(0, (DATA.decisionScenarios[gameState.scenarioIndex].trailer || []).length - 1);
        } else if (gameState.phase === "vote") {
          gameState.phase = "intro";
        } else if (gameState.phase === "reveal") {
          gameState.phase = "vote";
        } else if (gameState.phase === "worst") {
          const scenario = DATA.decisionScenarios[gameState.scenarioIndex];
          const selectedChoice = scenario && scenario.choices[gameState.selectedChoice];
          gameState.phase = selectedChoice && selectedChoice.jumpToWorst ? "vote" : "reveal";
        }
        render();
      }

      document.addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight") {
          event.preventDefault();
          if (state.screen === "game") advanceDecisionGame();
          else navigateNext();
          return;
        }
        if (event.key === "ArrowLeft") {
          event.preventDefault();
          if (state.screen === "game") reverseDecisionGame();
          else navigateBack();
        }
      });

      DATA.games.forEach((game) => resetGame(game.id));
      applyInitialHash();
      render();
    })();
  </script>
</body>
</html>
